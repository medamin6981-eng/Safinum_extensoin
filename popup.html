<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Safinum Haoussa</title>
<style>
  body { width: 280px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; color: #0f172a; background: #ffffff; }
  h1 { margin: 0 0 2px; font-size: 15px; }
  .site { margin: 0 0 10px; color: #475569; font-size: 12px; word-break: break-all; }
  .status { margin: 0 0 10px; padding: 6px 8px; border-radius: 4px; background: #f1f5f9; color: #334155; font-size: 12px; }
  .status.on { background: #dcfce7; color: #166534; }
  .status.error { background: #fee2e2; color: #991b1b; }
  button { width: 100%; padding: 8px; border: none; border-radius: 4px; font-weight: 600; font-size: 13px; color: #ffffff; background: #0369a1; cursor: pointer; }
  button:hover { background: #075985; }
  button.stop { background: #b91c1c; }
  button.stop:hover { background: #991b1b; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .option { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; font-size: 12px; cursor: pointer; }
  .option input { margin-top: 2px; }
</style>
</head>
<body>
  <h1>Safinum Haoussa</h1>
  <p class="site" id="site">…</p>
  <p class="status" id="status">Vérification de la page…</p>
  <button id="toggle-btn" type="button" disabled>Traduire ce site</button>

  <label class="option">
    <input type="checkbox" id="machine-toggle" checked>
    <span>Traduction automatique des messages inconnus</span>
  </label>

  <script src="popup.js"></script>
</body>
</html>
